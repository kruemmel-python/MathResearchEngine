name: Windows build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-windows -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build-windows --config Release --parallel
      - name: Test
        run: cmake --build build-windows --config Release --target RUN_TESTS
